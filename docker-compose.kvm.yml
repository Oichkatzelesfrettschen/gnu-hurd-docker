---
# =============================================================================
# GNU/Hurd Docker Compose - KVM Acceleration Override (Linux x86_64 only)
# =============================================================================
# Use with:
#   docker compose -f docker-compose.yml -f docker-compose.kvm.yml up -d
#
# Notes:
# - KVM acceleration only works when the HOST is Linux x86_64 and /dev/kvm exists.
# - On non-x86_64 hosts (arm64, etc.), QEMU will run in TCG mode and this file
#   should NOT be used.
# =============================================================================

services:
  gnu-hurd-dev:
    devices:
      - /dev/kvm:/dev/kvm:rw
    environment:
      DISABLE_KVM: ${DISABLE_KVM:-0}
