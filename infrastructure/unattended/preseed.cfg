### Debian GNU/Hurd amd64 unattended install seed
### Generated/used by scripts/build-hurd-unattended-iso.sh

# Keep initrd preseed behavior aligned with full auto mode.
d-i auto-install/enable boolean true
d-i auto-install/cloak_initrd_preseed boolean true
d-i debconf/priority string critical

# Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string hurd-auto
d-i netcfg/get_domain string local

# Mirror (Debian Ports)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian-ports
d-i mirror/http/proxy string

d-i apt-setup/use_mirror boolean true
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean false

# Clock/timezone
d-i time/zone string UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false

# Users/passwords
d-i passwd/root-login boolean true
d-i passwd/root-password password root
d-i passwd/root-password-again password root
d-i passwd/user-fullname string Agents User
d-i passwd/username string agents
d-i passwd/user-password password agents
d-i passwd/user-password-again password agents
d-i user-setup/allow-password-weak boolean true

# Partitioning
d-i partman-auto/disk string /dev/wd0
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select hurd-root
d-i partman-auto/expert_recipe string                         \
      hurd-root ::                                            \
              64 10000 -1 ext2                               \
                      $primary{ } $bootable{ }               \
                      method{ format } format{ }             \
                      use_filesystem{ } filesystem{ ext2 }   \
                      mountpoint{ / }                        \
              .
d-i partman-partitioning/default_label string msdos
d-i partman/default_label string msdos
d-i partman-basicfilesystems/create_swap_failed seen true
d-i partman-basicfilesystems/no_swap boolean true
d-i partman-basicfilesystems/no_swap seen true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-partitioning/confirm_write_new_label seen true
d-i partman/choose_partition select finish
d-i partman/choose_partition seen true
d-i partman/confirm boolean true
d-i partman/confirm seen true
d-i partman/confirm_nooverwrite boolean true
d-i partman/confirm_nooverwrite seen true

# Package selection
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server random-egd sudo netbase ifupdown isc-dhcp-client
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Bootloader + finish
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i finish-install/reboot_in_progress note

# Late command: baseline ssh/sudo usability for automation.
d-i preseed/late_command string \
    in-target /bin/sh -c 'id agents >/dev/null 2>&1 || useradd -m -s /bin/bash -G sudo agents'; \
    in-target /bin/sh -c "echo 'agents:agents' | chpasswd"; \
    in-target /bin/sh -c "echo 'agents ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/agents"; \
    in-target /bin/sh -c 'chmod 0440 /etc/sudoers.d/agents'; \
    in-target /bin/sh -c "sed -i '/[[:space:]]swap[[:space:]]/d' /etc/fstab || true"; \
    in-target /bin/sh -c 'if [ -x /etc/init.d/ssh ]; then /etc/init.d/ssh restart || true; fi'; \
    in-target /bin/sh -c 'update-rc.d ssh defaults || true'
