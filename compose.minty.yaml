# Minty Hurd profile overlay.
#
# This adds the Minty guest image and the desktop-specific forwards to the
# canonical `gnu-hurd-dev` service. It declares no service of its own: a second
# service name would make Compose start a second QEMU container beside the base
# one, and the two would contend for the same qcow2.
#
# The image bind, the KVM device, and the VNC surface each already have an
# overlay that owns them, so this file names none of them:
#
#   compose.bind.yaml   ./images bind mount
#   compose.kvm.yaml    /dev/kvm exposure
#   compose.vnc.yaml    QEMU VNC display and the noVNC sidecar
#   compose.yaml        SSH, HTTP, serial, and monitor ports
#
# Usage, through the Make targets that compose these files:
#
#   make minty-up           TCG baseline
#   make minty-up-kvm       adds compose.kvm.yaml and FORCE_KVM=1
#   make minty-up-vnc       adds compose.vnc.yaml and the noVNC sidecar

---
services:
  gnu-hurd-dev:
    image: ${MINTY_CONTAINER_IMAGE:-gnu-hurd-docker:latest}

    environment:
      # The 16 GB Minty guest, cloned from the debian-hurd-amd64 baseline and
      # provisioned. compose.bind.yaml is what places ./images here.
      QEMU_DRIVE: /opt/hurd-image/hurd-working.qcow2

      QEMU_RAM: ${MINTY_QEMU_RAM:-2048}
      # The installed kernel is the uniprocessor Mach build, so the guest
      # reports one processor whatever QEMU presents and a second vCPU buys no
      # guest parallelism. Raising this varies host-side QEMU behavior rather
      # than guest scaling, so the matrix sets it explicitly and the default
      # holds the emulated topology to what the kernel can use.
      QEMU_SMP: ${MINTY_QEMU_SMP:-1}
      QEMU_IDE_WRITE_CACHE: auto

      # One unbroken line. A YAML folded scalar turns each newline into a
      # space, so the folded form yields "tcp::8080-:80, tcp::5901-:5901" and
      # QEMU rejects the leading space with "Invalid host forwarding rule ...
      # (Bad protocol name)". The entrypoint splits this value on commas and
      # appends each element to hostfwd=, so no element may carry whitespace.
      QEMU_HOSTFWDS: "tcp::2222-:22,tcp::8080-:80,tcp::5901-:5901,udp::60000-:60000,udp::60001-:60001,udp::60002-:60002"

    ports:
      # The desktop's own VNC server inside the guest, which is a different
      # display from the QEMU framebuffer compose.vnc.yaml publishes.
      - "127.0.0.1:${MINTY_DESKTOP_VNC_PORT:-5901}:5901"
      # mosh-server, matching the MOSH_PORT_RANGE exported in the guest profile.
      - "127.0.0.1:60000-60002:60000-60002/udp"

    labels:
      com.gnu-hurd.profile: "minty"
      com.gnu-hurd.desktop.target: "mate"
