---
name: Create Release with Artifacts

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_NAME: gnu-hurd-docker-release

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_clean=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      # git archive makes the repository tree the definition of the release, so
      # the archive cannot drift from what the repository actually contains.  A
      # handcrafted manifest copied only top-level scripts/*.sh and scripts/*.py,
      # which dropped scripts/lib, scripts/automation, scripts/test-phases, and
      # share/ -- files the packaged scripts/validate-config.sh requires.  The
      # archive therefore shipped a validator it could not satisfy.
      #
      # .gitattributes carries the export policy: ARCHIVE/, docs/reports/, and
      # ssh-test-keys/ are export-ignore, so they stay out of the tarball.
      - name: Create the complete archive
        run: |
          echo "=== Creating release archive from the repository tree ==="
          VER="${{ steps.version.outputs.version_clean }}"
          git archive \
            --format=tar.gz \
            --prefix="gnu-hurd-docker-$VER/" \
            --output="gnu-hurd-docker-$VER.tar.gz" \
            "$GITHUB_SHA"
          sha256sum "gnu-hurd-docker-$VER.tar.gz" > "gnu-hurd-docker-$VER.tar.gz.sha256"
          echo "Archive entries: $(tar -tzf "gnu-hurd-docker-$VER.tar.gz" | wc -l)"

      # Checking repository sources proves the inputs exist; it cannot prove the
      # product works.  This extracts the tarball into a clean directory and runs
      # the operations its own documentation tells a user to run, including the
      # packaged validator -- the check the handcrafted manifest could never pass,
      # because it omitted the files that validator requires.
      - name: Verify the extracted archive
        run: |
          echo "=== Verifying the archive a user actually downloads ==="
          VER="${{ steps.version.outputs.version_clean }}"
          # The packaged validator runs ShellCheck and parses the Compose files
          # with PyYAML, exiting 1 if either is unavailable.  Both come from apt:
          # a system-level `pip install` is refused on the runner image under
          # PEP 668, which would abort this step before the gate runs at all.
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          shellcheck --version

          workdir="$(mktemp -d)"
          echo "extract_dir=$workdir" >> "$GITHUB_ENV"
          tar -xzf "gnu-hurd-docker-$VER.tar.gz" -C "$workdir"

          root="$workdir/gnu-hurd-docker-$VER"
          if [ ! -d "$root" ]; then
            echo "ERROR: archive has no gnu-hurd-docker-$VER/ top-level directory"
            ls -la "$workdir"
            exit 1
          fi

          # Every file the quick start in these release notes depends on.
          REQUIRED="entrypoint.sh Dockerfile compose.yaml compose.bind.yaml Makefile
                    scripts/validate-config.sh scripts/setup-hurd-amd64.sh
                    README.md docs/index.md
                    docs/01-GETTING-STARTED/INSTALLATION.md
                    docs/01-GETTING-STARTED/REQUIREMENTS.md"
          missing=0
          for required_path in $REQUIRED; do
            if [ ! -f "$root/$required_path" ]; then
              echo "ERROR: archive is missing $required_path"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          if [ ! -x "$root/scripts/setup-hurd-amd64.sh" ] || \
             [ ! -x "$root/scripts/validate-config.sh" ]; then
            echo "ERROR: packaged entry-point scripts are not executable"
            exit 1
          fi

          # Both documented entry points have to parse against the packaged Makefile.
          ( cd "$root" && make -n up >/dev/null && make -n build >/dev/null ) || {
            echo "ERROR: 'make -n up' or 'make -n build' fails inside the archive"
            exit 1
          }

          # The archive ships scripts/validate-config.sh and its README tells the
          # user to run it.  It has to pass against the archive's own contents.
          ( cd "$root" && ./scripts/validate-config.sh ) || {
            echo "ERROR: the packaged validator fails against the packaged tree"
            exit 1
          }

          # Documentation links have to resolve inside the archive, not only in
          # the repository the docs were written in.  link-scanner.py reports its
          # findings and exits 0 either way, so the count in its JSON output is
          # what decides the gate.
          ( cd "$root" && python3 scripts/utils/link-scanner.py --docs-root docs \
              --report /tmp/archive-link-scan.md --json /tmp/archive-link-scan.json )
          python3 - <<'PY'
          import json, sys
          summary = json.load(open('/tmp/archive-link-scan.json'))['summary']
          broken = summary['broken_links']
          print(f"packaged docs: {summary['total_links']} internal links, {broken} broken")
          if broken:
              sys.exit(1)
          PY

          # The default development composition has to resolve from the archive.
          if command -v docker >/dev/null 2>&1; then
            ( cd "$root" && docker compose -f compose.yaml -f compose.bind.yaml config -q ) || {
              echo "ERROR: packaged compose files do not validate"
              exit 1
            }
          else
            echo "[SKIP] docker unavailable; compose validation not run"
          fi

          echo "[OK] the extracted archive satisfies its own documented contract"

      # The subset packages are cut from the verified extraction, so they carry
      # exactly the files the acceptance test just exercised.
      - name: Create standalone scripts package
        run: |
          echo "=== Creating standalone scripts package ==="
          VER="${{ steps.version.outputs.version_clean }}"
          root="$extract_dir/gnu-hurd-docker-$VER"
          tar -czf "gnu-hurd-docker-scripts-$VER.tar.gz" -C "$root" scripts share
          sha256sum "gnu-hurd-docker-scripts-$VER.tar.gz" \
            > "gnu-hurd-docker-scripts-$VER.tar.gz.sha256"

      - name: Create documentation package
        run: |
          echo "=== Creating documentation package ==="
          VER="${{ steps.version.outputs.version_clean }}"
          root="$extract_dir/gnu-hurd-docker-$VER"
          tar -czf "gnu-hurd-docker-docs-$VER.tar.gz" -C "$root" README.md ROADMAP.md docs
          sha256sum "gnu-hurd-docker-docs-$VER.tar.gz" \
            > "gnu-hurd-docker-docs-$VER.tar.gz.sha256"

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release-notes.md << 'EOF'
          # GNU/Hurd Docker Release ${{ steps.version.outputs.version }}

          ## 🎉 What's New

          This release includes a complete GNU/Hurd Docker environment with production-grade features:

          ### 🐳 Docker Image
          The Docker image is available on GitHub Container Registry:
          ```bash
          docker pull ghcr.io/oichkatzelesfrettschen/gnu-hurd-docker:${{ steps.version.outputs.version }}
          docker pull ghcr.io/oichkatzelesfrettschen/gnu-hurd-docker:latest
          ```

          ### 📦 Release Artifacts

          Three packages are available for download:

          1. **Source tree** (`gnu-hurd-docker-${{ steps.version.outputs.version_clean }}.tar.gz`)
             - The repository tree at this tag, produced by `git archive`
             - Excludes `ARCHIVE/`, `docs/reports/`, and test SSH keys per `.gitattributes`
             - Carries no disk image; run `./scripts/setup-hurd-amd64.sh` to fetch one
             - Recommended for most users

          2. **Scripts and share** (`gnu-hurd-docker-scripts-${{ steps.version.outputs.version_clean }}.tar.gz`)
             - `scripts/` and `share/` cut from the verified source tree
             - Depends on the Compose and Makefile in the source tree for `make` targets

          3. **Documentation** (`gnu-hurd-docker-docs-${{ steps.version.outputs.version_clean }}.tar.gz`)
             - `README.md`, `ROADMAP.md`, and the full `docs/` tree

          All packages include SHA256 checksums for verification.

          The source tree is verified before publication: it extracts into a clean
          directory, `make -n up` and `make -n build` parse, `./scripts/validate-config.sh`
          passes against the archive's own contents, the documentation link scanner
          reports no broken internal links, and the default Compose overlay resolves.

          ### ✨ Features

          - **Debian GNU/Hurd 2025** (x86_64/amd64) with full microkernel support
          - **QEMU Optimization** - VirtIO devices, KVM acceleration, multiple display modes
          - **Graphics Support** - VNC, SDL/GTK with OpenGL, framebuffer acceleration
          - **Development Ready** - Pre-configured with build tools and packages
          - **CI/CD Workflows** - Complete automation for testing and deployment
          - **Comprehensive Documentation** - the full `docs/01-08` tree, link-scanned clean

          ### 🚀 Quick Start

          **Option 1: Using Docker Image**
          ```bash
          # Pull the image
          docker pull ghcr.io/oichkatzelesfrettschen/gnu-hurd-docker:latest

          # Clone repo for Compose + scripts (recommended)
          git clone https://github.com/Oichkatzelesfrettschen/gnu-hurd-docker.git
          cd gnu-hurd-docker

          # Prepare disk image (bind mode)
          ./scripts/setup-hurd-amd64.sh

          # Pull latest container image
          docker compose pull

          # Run (no privileged container required; KVM uses /dev/kvm device mapping when enabled)
          make up

          # Access
          ssh -p 2222 root@localhost  # Password: root
          ```

          **Option 2: Using Release Archive**
          ```bash
          # Download and extract
          REPO="https://github.com/Oichkatzelesfrettschen/gnu-hurd-docker"
          VER="${{ steps.version.outputs.version }}"
          VCLEAN="${{ steps.version.outputs.version_clean }}"
          wget $REPO/releases/download/$VER/gnu-hurd-docker-$VCLEAN.tar.gz
          tar xzf gnu-hurd-docker-$VCLEAN.tar.gz
          cd gnu-hurd-docker-$VCLEAN

          # Download Hurd image
          ./scripts/setup-hurd-amd64.sh

          # Build and run
          make up
          ```

          **Option 3: Clone Repository**
          ```bash
          git clone https://github.com/Oichkatzelesfrettschen/gnu-hurd-docker.git
          cd gnu-hurd-docker
          ./scripts/setup-hurd-amd64.sh
          make up
          ```

          ### 📚 Documentation

          - [Documentation Index](docs/index.md)
          - [Installation Guide](docs/01-GETTING-STARTED/INSTALLATION.md)
          - [System Requirements](docs/01-GETTING-STARTED/REQUIREMENTS.md)
          - [CI/CD Guide](docs/05-CI-CD/GUIDE.md)
          - [Roadmap](ROADMAP.md)

          ### 🔒 Verification

          - `scripts/validate-config.sh` runs against the extracted archive and passes,
            which includes ShellCheck at error severity over the maintained shell surface
          - SHA256 checksums accompany every artifact

          Trivy image scanning, dependency auditing, and supply-chain attestation are
          not performed by this release job. Check the workflow runs for this tag before
          treating any of them as covered.

          ### 🐛 Bug Reports

          Please report issues at: https://github.com/Oichkatzelesfrettschen/gnu-hurd-docker/issues

          ### 📝 Changelog

          See commit history for detailed changes.
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            gnu-hurd-docker-${{ steps.version.outputs.version_clean }}.tar.gz
            gnu-hurd-docker-${{ steps.version.outputs.version_clean }}.tar.gz.sha256
            gnu-hurd-docker-scripts-${{ steps.version.outputs.version_clean }}.tar.gz
            gnu-hurd-docker-scripts-${{ steps.version.outputs.version_clean }}.tar.gz.sha256
            gnu-hurd-docker-docs-${{ steps.version.outputs.version_clean }}.tar.gz
            gnu-hurd-docker-docs-${{ steps.version.outputs.version_clean }}.tar.gz.sha256

      - name: Generate summary
        run: |
          VER="${{ steps.version.outputs.version }}"
          VCLEAN="${{ steps.version.outputs.version_clean }}"
          echo "## 📦 Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $VER" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Complete package: \`gnu-hurd-docker-$VCLEAN.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- Scripts only: \`gnu-hurd-docker-scripts-$VCLEAN.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation: \`gnu-hurd-docker-docs-$VCLEAN.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat gnu-hurd-docker-$VCLEAN.tar.gz.sha256 >> $GITHUB_STEP_SUMMARY
          cat gnu-hurd-docker-scripts-$VCLEAN.tar.gz.sha256 >> $GITHUB_STEP_SUMMARY
          cat gnu-hurd-docker-docs-$VCLEAN.tar.gz.sha256 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/oichkatzelesfrettschen/gnu-hurd-docker:$VER" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
