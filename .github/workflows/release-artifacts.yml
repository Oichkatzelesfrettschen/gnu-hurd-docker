---
name: Create Release with Artifacts

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_NAME: gnu-hurd-docker-release

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A workflow_dispatch version is arbitrary operator input that reaches
      # file names and the release tag, so scripts/build-release-archive.sh
      # checks it against the supported grammar and refuses anything else.  The
      # archive is always cut from GITHUB_SHA, so a dispatch cannot publish one
      # commit's tree under a version that names another.
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_clean=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION at $GITHUB_SHA"

      - name: Install archive gate dependencies
        run: |
          # The packaged validator runs ShellCheck and parses the Compose files
          # with PyYAML, exiting 1 if either is unavailable.  Both come from apt:
          # a system-level `pip install` is refused on the runner image under
          # PEP 668, which would abort this step before the gate runs at all.
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          shellcheck --version

      # One script builds and accepts the archive, and the Release Archive Check
      # workflow runs the same script on pull requests, so the artifact that gets
      # published is the artifact that got tested.
      - name: Build and accept the release archive
        run: |
          ./scripts/build-release-archive.sh \
            --version "${{ steps.version.outputs.version }}" \
            --commit "$GITHUB_SHA" \
            --output-dir "$PWD"

      # An annotated tag has to name the commit the archive was cut from,
      # otherwise the release advertises contents no tag resolves to.
      - name: Verify the tag resolves to the archived commit
        if: github.event_name == 'push'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tagged="$(git rev-parse --verify "refs/tags/$VERSION^{commit}")"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "ERROR: tag $VERSION resolves to $tagged, not the archived $GITHUB_SHA" >&2
            exit 1
          fi
          echo "[OK] $VERSION resolves to $GITHUB_SHA"

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release-notes.md << 'EOF'
          # GNU/Hurd Docker Release ${{ steps.version.outputs.version }}

          ## 🎉 What's New

          This release publishes the repository source tree at this tag, verified
          against its own documented contract. It publishes no container image:
          building and pushing to GitHub Container Registry is a separate workflow,
          and this job neither runs it nor reads its result. Check that workflow's
          runs for this tag before pulling a tag from GHCR.

          ### 📦 Release Artifacts

          Three packages are available for download:

          1. **Source tree** (`gnu-hurd-docker-${{ steps.version.outputs.version_clean }}.tar.gz`)
             - The repository tree at this tag, produced by `git archive`
             - Excludes `ARCHIVE/`, `docs/reports/`, and test SSH keys per `.gitattributes`
             - Carries no disk image; run `./scripts/setup-hurd-amd64.sh` to fetch one
             - Recommended for most users

          2. **Scripts and share** (`gnu-hurd-docker-scripts-${{ steps.version.outputs.version_clean }}.tar.gz`)
             - `scripts/` and `share/` cut from the verified source tree
             - Depends on the Compose and Makefile in the source tree for `make` targets

          3. **Documentation** (`gnu-hurd-docker-docs-${{ steps.version.outputs.version_clean }}.tar.gz`)
             - `README.md`, `ROADMAP.md`, and the full `docs/` tree

          All packages include SHA256 checksums for verification.

          The source tree is verified before publication: it extracts into a clean
          directory, `make -n up` and `make -n build` parse, `./scripts/validate-config.sh`
          passes against the archive's own contents, the documentation link scanner
          reports no broken internal links, and the default Compose overlay resolves.

          ### ✨ What this tree provides

          These are the paths the source tree configures. The archive gate is a
          static check and boots no guest, so it establishes that the
          configuration parses and validates, not that any of it runs.

          - Debian GNU/Hurd (x86_64 guest) under `qemu-system-x86_64`, inside a
            Docker or Podman container
          - Accelerator selected at startup: KVM when `compose.kvm.yaml` maps
            `/dev/kvm` and the entrypoint chooses it, TCG otherwise -- under the
            default `pc` machine with an IDE disk it chooses TCG unless
            `FORCE_KVM=1`
          - Disk bus paths for `ide`, `ahci`, and `scsi` via `QEMU_DISK_BUS`
          - Optional VNC and noVNC console access through `compose.vnc.yaml`
          - The maintained shell surface passing ShellCheck at error severity
          - The full `docs/01-08` tree with no broken internal links

          ### 🚀 Quick Start

          **Option 1: Using Release Archive**
          ```bash
          # Download and extract
          REPO="https://github.com/Oichkatzelesfrettschen/gnu-hurd-docker"
          VER="${{ steps.version.outputs.version }}"
          VCLEAN="${{ steps.version.outputs.version_clean }}"
          wget $REPO/releases/download/$VER/gnu-hurd-docker-$VCLEAN.tar.gz
          tar xzf gnu-hurd-docker-$VCLEAN.tar.gz
          cd gnu-hurd-docker-$VCLEAN

          # Download Hurd image
          ./scripts/setup-hurd-amd64.sh

          # Build and run
          make up
          ```

          **Option 2: Clone Repository**
          ```bash
          git clone https://github.com/Oichkatzelesfrettschen/gnu-hurd-docker.git
          cd gnu-hurd-docker
          ./scripts/setup-hurd-amd64.sh
          make up
          ```

          ### 📚 Documentation

          - [Documentation Index](docs/index.md)
          - [Installation Guide](docs/01-GETTING-STARTED/INSTALLATION.md)
          - [System Requirements](docs/01-GETTING-STARTED/REQUIREMENTS.md)
          - [CI/CD Guide](docs/05-CI-CD/GUIDE.md)
          - [Roadmap](ROADMAP.md)

          ### 🔒 Verification

          What this release job checked, by running `scripts/build-release-archive.sh`
          against the archive it publishes:

          - the tarball extracts and contains every file the quick start above uses
          - `make -n up` and `make -n build` parse inside the extracted tree
          - the packaged `./scripts/validate-config.sh` passes against the packaged
            contents, which runs ShellCheck at error severity over the maintained
            shell surface
          - the packaged documentation link scan reports no broken internal links
          - the default Compose overlay resolves
          - SHA256 checksums accompany every artifact

          What it did not check: no guest boots, no filesystem integrity check runs
          against any qcow2, and no container image is built, scanned, or published.
          Trivy image scanning, dependency auditing, and supply-chain attestation are
          not performed by this job.

          ### 🐛 Bug Reports

          Please report issues at: https://github.com/Oichkatzelesfrettschen/gnu-hurd-docker/issues

          ### 📝 Changelog

          See commit history for detailed changes.
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            gnu-hurd-docker-${{ steps.version.outputs.version_clean }}.tar.gz
            gnu-hurd-docker-${{ steps.version.outputs.version_clean }}.tar.gz.sha256
            gnu-hurd-docker-scripts-${{ steps.version.outputs.version_clean }}.tar.gz
            gnu-hurd-docker-scripts-${{ steps.version.outputs.version_clean }}.tar.gz.sha256
            gnu-hurd-docker-docs-${{ steps.version.outputs.version_clean }}.tar.gz
            gnu-hurd-docker-docs-${{ steps.version.outputs.version_clean }}.tar.gz.sha256

      - name: Generate summary
        run: |
          VER="${{ steps.version.outputs.version }}"
          VCLEAN="${{ steps.version.outputs.version_clean }}"
          echo "## 📦 Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $VER" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Source tree: \`gnu-hurd-docker-$VCLEAN.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- Scripts only: \`gnu-hurd-docker-scripts-$VCLEAN.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation: \`gnu-hurd-docker-docs-$VCLEAN.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat gnu-hurd-docker-$VCLEAN.tar.gz.sha256 >> $GITHUB_STEP_SUMMARY
          cat gnu-hurd-docker-scripts-$VCLEAN.tar.gz.sha256 >> $GITHUB_STEP_SUMMARY
          cat gnu-hurd-docker-docs-$VCLEAN.tar.gz.sha256 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Not published here" >> $GITHUB_STEP_SUMMARY
          echo "No container image was built or pushed by this job." >> $GITHUB_STEP_SUMMARY
