---
name: Configuration Validation

"on":
  push:
    paths:
      - Dockerfile
      - entrypoint.sh
      - Makefile
      - compose.yaml
      - PKGBUILD
      - 'gnu-hurd-docker-kernel-fix.install'
      - 'scripts/**'
      - 'share/**'
      - '.github/workflows/validate-config.yml'
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - Makefile
      - compose.yaml
      - PKGBUILD
      - 'gnu-hurd-docker-kernel-fix.install'
      - 'scripts/**'
      - 'share/**'
      - '.github/workflows/validate-config.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Validate Configuration Files

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt-get update
          # PyYAML and ShellCheck both come from apt: a system-level pip install
          # is refused on the runner image under PEP 668, which would abort setup
          # before any gate runs.
          sudo apt-get install -y shellcheck python3 python3-yaml
          shellcheck --version

      - name: Validate Dockerfile
        run: |
          echo "[*] Validating Dockerfile syntax..."
          if ! docker run --rm -i hadolint/hadolint < Dockerfile; then
            echo "[WARN] Dockerfile has linting issues (non-blocking)"
          fi
          echo "[OK] Dockerfile structure valid"

      # Naming three scripts here left the rest of the maintained surface
      # unchecked by this workflow while scripts/validate-config.sh checked all of
      # it, so the two gates reported different answers about the same tree.
      # `make lint` reads scripts/list-maintained-shell.sh, the shared enumerator.
      - name: Validate the maintained shell surface
        run: |
          echo "[*] Running shellcheck over the maintained shell surface..."
          make lint
          echo "[OK] maintained shell scripts have no errors"

      - name: Validate compose.yaml
        run: |
          echo "[*] Validating YAML syntax..."
          python3 -c "import yaml; yaml.safe_load(open('compose.yaml')); print('[OK] Valid YAML syntax')"

      - name: Verify file structure
        run: |
          echo "[*] Checking required files..."
          test -f Dockerfile && echo "[OK] Dockerfile exists"
          test -f entrypoint.sh && echo "[OK] entrypoint.sh exists"
          test -f compose.yaml && echo "[OK] compose.yaml exists"
          test -f PKGBUILD && echo "[OK] PKGBUILD exists"
          test -x entrypoint.sh && echo "[OK] entrypoint.sh is executable"
          test -x scripts/fix-script.sh && echo "[OK] scripts/fix-script.sh is executable"
          test -x scripts/health-check.sh && echo "[OK] scripts/health-check.sh is executable"
          test -f scripts/lib/colors.sh && echo "[OK] scripts/lib/colors.sh exists"
          test -f scripts/lib/container-helpers.sh && echo "[OK] scripts/lib/container-helpers.sh exists"

      - name: Summary
        run: |
          echo "=========================================="
          echo "Configuration Validation Complete"
          echo "=========================================="
          echo "All required files present and valid"

      - name: Generate workflow summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✅ Configuration Validation - Summary

          **Workflow:** Validate Configuration Files
          **Status:** ${{ job.status }}
          **Run ID:** ${{ github.run_id }}

          ### Checks Performed
          - ✓ ShellCheck over the maintained shell surface (errors only)
          - ✓ YAML syntax validation
          - ✓ File structure verification

          ### Files Validated
          - **Dockerfile:** ✓ Present
          - **entrypoint.sh:** ✓ Present and executable
          - **compose.yaml:** ✓ Present and valid YAML
          - **PKGBUILD:** ✓ Present
          - **fix-script.sh:** ✓ Executable
          - **health-check.sh:** ✓ Executable
          - **Library files:** ✓ Present (colors.sh, container-helpers.sh)

          ### Result
          All required configuration files are present and valid.
          EOF
