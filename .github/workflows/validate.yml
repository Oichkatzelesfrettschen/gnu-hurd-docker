---
name: Validate Configuration

"on":
  push:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'compose*.yaml'
      - 'Makefile'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'compose*.yaml'
      - 'Makefile'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/validate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Validate Docker Configuration

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pip
          pip install pyyaml

      - name: Repo validation (shell errors enforced, warnings reported)
        run: |
          make lint
          make validate
          make security
          make links

      - name: Generate workflow summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✅ Validate Configuration - Summary

          **Workflow:** Validate Docker Configuration
          **Status:** ${{ job.status }}
          **Run ID:** ${{ github.run_id }}

          ### Checks Performed
          - ✓ ShellCheck (warnings as errors)
          - ✓ Repo invariants (scripts/validate-config.sh)
          - ✓ Compose security posture (scripts/validate-security-config.sh)
          - ✓ Docs internal link scan (scripts/utils/link-scanner.py)

          ### Files Validated
          - **Shell scripts:** ShellCheck clean
          - **Compose:** Base + overlays parse and agree
          - **Docs:** Internal links consistent

          ### Repository Health
          All configuration files pass validation checks.
          EOF
