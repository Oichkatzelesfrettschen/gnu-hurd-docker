---
name: Validate Configuration

"on":
  push:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'compose*.yaml'
      - 'docker-bake.hcl'
      - 'Makefile'
      - 'PKGBUILD'
      - 'scripts/**'
      - 'share/**'
      - 'config/**'
      - 'infrastructure/unattended/**'
      - 'docs/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'compose*.yaml'
      - 'docker-bake.hcl'
      - 'Makefile'
      - 'PKGBUILD'
      - 'scripts/**'
      - 'share/**'
      - 'config/**'
      - 'infrastructure/unattended/**'
      - 'docs/**'
      - '.github/workflows/validate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Validate Docker Configuration

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No actions/setup-python here: it puts a toolcache interpreter ahead of
      # the system python3 on PATH, while apt installs PyYAML for the system
      # interpreter, so `make validate` would run a Python that cannot import
      # yaml.  The gates run against the system interpreter apt provisions.
      - name: Install dependencies
        run: |
          sudo apt-get update
          # PyYAML and ShellCheck both come from apt: a system-level pip install
          # is refused on the runner image under PEP 668, which would abort setup
          # before any gate runs.
          sudo apt-get install -y shellcheck python3-yaml
          shellcheck --version

      - name: Repo validation (shell errors enforced, warnings reported)
        run: |
          make lint
          make validate
          make security
          make links

      - name: Generate workflow summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✅ Validate Configuration - Summary

          **Workflow:** Validate Docker Configuration
          **Status:** ${{ job.status }}
          **Run ID:** ${{ github.run_id }}

          ### Checks Performed
          - ✓ ShellCheck over the maintained surface at error severity, with
            warning-level findings reported and not enforced (roadmap item 43)
          - ✓ Repo invariants (scripts/validate-config.sh)
          - ✓ Compose security posture (scripts/validate-security-config.sh)
          - ✓ Docs internal link scan, broken-link count asserted
            (scripts/utils/link-scanner.py + scripts/check-link-scan-result.py)

          ### Files Validated
          - **Shell scripts:** no ShellCheck errors
          - **Compose:** Base + overlays parse and agree
          - **Docs:** Internal links consistent

          ### Repository Health
          All configuration files pass validation checks.
          EOF
