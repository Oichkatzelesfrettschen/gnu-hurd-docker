---
name: Build and Push to GitHub Container Registry

"on":
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Test Docker image
        run: |
          echo "=== Testing Docker image ==="
          docker images | grep gnu-hurd

          # Get the first tag for testing
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Testing with tag: $TAG"

          # Verify QEMU is installed (override entrypoint to skip disk check)
          docker run --rm --entrypoint qemu-system-x86_64 $TAG --version

          # Verify health check script exists
          docker run --rm --entrypoint ls $TAG -la /opt/scripts/health-check.sh

          # Verify entrypoint is executable
          docker run --rm --entrypoint ls $TAG -la /entrypoint.sh

          echo "=== Docker image test passed ==="

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Generate attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          artifact-name: sbom-${{ github.run_id }}.spdx.json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Generate image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## 🐳 Docker Image Published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`ghcr.io\`" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📦 Available Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🚀 Quick Start" >> $GITHUB_STEP_SUMMARY
          REPO="${{ github.repository }}"
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Pull the latest image" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Download and prepare the Debian GNU/Hurd disk image (first time only)" >> $GITHUB_STEP_SUMMARY
          echo "git clone https://github.com/${{ github.repository }}.git" >> $GITHUB_STEP_SUMMARY
          echo "cd $(basename ${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
          echo "./scripts/setup-hurd-amd64.sh" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Run (dev bind mode)" >> $GITHUB_STEP_SUMMARY
          echo "make up" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Access via SSH (once booted, ~60 seconds)" >> $GITHUB_STEP_SUMMARY
          echo "ssh -p 2222 root@localhost  # Password: root" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📚 Documentation" >> $GITHUB_STEP_SUMMARY
          BASE="https://github.com/$REPO/blob/main"
          echo "- [Documentation Index]($BASE/docs/index.md)" >> $GITHUB_STEP_SUMMARY
          echo "- [Quickstart]($BASE/docs/01-GETTING-STARTED/QUICKSTART.md)" >> $GITHUB_STEP_SUMMARY
          echo "- [System Design]($BASE/docs/02-ARCHITECTURE/SYSTEM-DESIGN.md)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🎯 Features" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Debian GNU/Hurd (ports/13.0) x86_64 guest" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ QEMU with KVM (Linux x86_64) and TCG fallback" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Guest-compatible defaults (IDE disk + e1000 NIC)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Optional VNC/noVNC for GUI access" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Optimized for CLI and GUI development" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Pre-configured with development tools" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
