---
# The canonical static gate, run on every pull request and every push to main.
#
# validate.yml, validate-config.yml, and quality-and-security.yml carry the
# same checks but are disabled at the repository level, so they produce no
# evidence about any commit.  This workflow runs the Makefile targets that are
# the gates themselves -- `make lint` over the maintained shell surface,
# `make validate` over the Compose and script invariants, `make security`
# against SECURITY.md, and a documentation link scan whose broken-link count is
# asserted rather than printed.  It boots nothing and needs no qcow2, so it says
# nothing about guest image integrity; roadmap item 36b covers that.
name: Static Gates

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: Shell, config, security, resolver, and link gates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The guest-baseline gate verifies the recorded producer digests
          # against the commit the collection ran from through git show, and a
          # depth-1 checkout carries only the merge commit, which makes every
          # committed producer digest unverifiable.
          fetch-depth: 0

      - name: Install gate dependencies
        run: |
          sudo apt-get update
          # PyYAML and ShellCheck both come from apt: a system-level pip install
          # is refused on the runner image under PEP 668, which would abort setup
          # before any gate runs.
          sudo apt-get install -y shellcheck python3 python3-yaml python3-jsonschema
          # ShellCheck findings move between releases, so the runner's version is
          # part of what a passing run means.
          shellcheck --version

      - name: Report the maintained shell surface
        run: |
          ./scripts/list-maintained-shell.sh
          echo "surface size: $(./scripts/list-maintained-shell.sh | wc -l)"

      - name: ShellCheck the maintained surface at the enforced severity
        run: make lint

      - name: Report warning-level ShellCheck findings
        continue-on-error: true
        run: make lint SHELLCHECK_SEVERITY=warning

      - name: Validate configuration invariants
        run: make validate

      - name: Validate security configuration
        run: make security

      # A Compose overlay declaring a service the base file does not adds a
      # service rather than overriding one, and its own text reads as correct.
      # Only the rendered configuration shows the second QEMU container, so the
      # engine performs the merge and the assertions run against what came out.
      - name: Assert the rendered Compose topology
        run: make topology

      # The archive fixtures cover the resolver and say nothing about the
      # entrypoint. This drives the real overlay mechanism in a container and
      # reads the filesystem afterwards, so the gate asserts behavior rather
      # than that the overlay code parses.
      - name: Exercise the disposable build overlay
        run: make overlay-lifecycle

      # The negative fixtures assert what the evidence contract rejects, and the
      # capture check recomputes each retained stream's digest.  A digest
      # mismatch is the signature of redaction that ran after hashing, which is
      # how a sanitized capture came to fail its own integrity record.
      - name: Validate the runtime evidence contract
        run: make evidence-check

      # The guest baseline seeds every closure verdict that claims to describe
      # this image, so a probe that silently stopped answering propagates into
      # a resolver report as a fact.  This asserts the package against itself:
      # advertised artifacts exist, digests match, required probes reached an
      # answer, and a partial capture is labelled rather than presented as one.
      - name: Validate the committed guest baseline
        run: make guest-baseline-check

      # The lock's digests are read from the files they name, so a resolver or
      # report edit that skips the lock writer shows up as a diff here rather
      # than as a build scheduled from stale inputs.
      - name: Assert the builder lock reproduces from the tree
        run: make builder-lock-check

      # The resolver's verdicts are produced by apt over a synthetic
      # architecture, so a source-level pass says nothing about whether a
      # verdict is right.  The image build proves the resolver's dependencies
      # are declared, and the fixture suite drives the classifier and the
      # metadata authentication against archives whose correct answer is known.
      # It runs entirely offline and never compares against the committed
      # reports, because sid, unreleased, and the LMDE suite move daily and such
      # a comparison would turn someone else's upload into a red gate.
      - name: Build the archive resolver and run its offline fixture suite
        run: make hurd-closure-selftest

      - name: Scan documentation links
        run: |
          python3 scripts/utils/link-scanner.py \
            --docs-root docs \
            --json "$RUNNER_TEMP/link-scan.json"
          python3 scripts/check-link-scan-result.py "$RUNNER_TEMP/link-scan.json"
