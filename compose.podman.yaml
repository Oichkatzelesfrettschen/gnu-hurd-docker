# Podman-specific compose override
# Uses an auto-assigned bridge subnet (no fixed CIDR) to avoid host conflicts

services:
  gnu-hurd-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: gnu-hurd-docker:latest
    container_name: gnu-hurd-dev-podman
    restart: unless-stopped
    environment:
      QEMU_DRIVE: /opt/hurd-image/${HURD_IMAGE_BASENAME:-debian-hurd-amd64.qcow2}
      QEMU_CDROM: ${QEMU_CDROM:-}
      QEMU_BOOT_ORDER: ${QEMU_BOOT_ORDER:-}
    volumes:
      - ./images:/opt/hurd-image:rw
      - ./infrastructure/cache/images/installers:/opt/hurd-installer:ro
      - ./share:/share:rw
    # Note: Podman ports are slightly different; use podman-specific port format
    ports:
      - "127.0.0.1:2223:2222"   # SSH (different port to avoid conflict with Docker instance)
      - "127.0.0.1:8081:8080"   # HTTP
      - "127.0.0.1:5556:5555"   # Serial console
      - "127.0.0.1:9998:9999"   # QEMU monitor
    # Use Podman's default network
    networks:
      - hurd-net

networks:
  hurd-net:
    driver: bridge
