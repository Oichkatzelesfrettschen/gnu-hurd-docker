---
site_name: GNU/Hurd Docker - Mach Development Environment
site_url: https://oichkatzelesfrettschen.github.io/gnu-hurd-docker
repo_url: https://github.com/Oichkatzelesfrettschen/gnu-hurd-docker
repo_name: Oichkatzelesfrettschen/gnu-hurd-docker
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

# Files the build skips entirely.  Archived and legacy documents record the
# pre-consolidation layout, so their links point at paths that no longer exist and
# are correct as history rather than as guidance.  Document templates carry
# placeholder links (../another-section/) that resolve only once a template is
# copied and filled in.  Both are preserved in the repository and omitted from the
# published site.
exclude_docs: |
  assets/templates/**
  **/archive/**
  archive/**

# Documents that are built and reachable by link but kept out of the navigation.
# Session reports, audits, and the link-fix and consolidation records describe past
# work rather than current usage.  Audits are declared as a directory rather than
# enumerated so that adding one cannot break a strict build.  Declaring them keeps `mkdocs build --strict`
# meaningful: an omission that is not listed here is a real error.
not_in_nav: |
  /reports/**
  /audits/**
  /CONSOLIDATION-FINAL-REPORT.md
  /CROSS-REFERENCE-FIX-SUMMARY.md
  /LINK-FIX-REPORT.md

